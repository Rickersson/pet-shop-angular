<header [class.scrolled]="isScrolled">
  <div class="container header-container">
    <div class="logo" (click)="scrollToSection('inicio')">
      <i class="fas fa-paw"></i>
      <h1>Amigo Fiel</h1>
    </div>
    
    <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
      <i class="fas" [class.fa-bars]="!isMobileMenuOpen" [class.fa-times]="isMobileMenuOpen"></i>
    </button>
    
    <ul class="nav-menu" [class.open]="isMobileMenuOpen">
      <li><a (click)="scrollToSection('inicio')">Início</a></li>
      <li><a (click)="scrollToSection('sobre')">Sobre</a></li>
      <li><a (click)="scrollToSection('servicos')">Serviços</a></li>
      <li><a (click)="scrollToSection('contato')">Contato</a></li>
    </ul>
    
    <button class="btn-contato" (click)="scrollToSection('contato')">Agendar Visita</button>
  </div>
</header>
